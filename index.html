<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i love you sukriti</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09070b;
      --ink: #fff8fb;
      --pink: #ff4f91;
      --gold: #ffd36b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", ui-rounded, system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      min-height: 100svh;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 52%, rgba(255, 79, 145, 0.3), transparent 28%),
        radial-gradient(circle at 18% 18%, rgba(102, 217, 255, 0.24), transparent 26%),
        radial-gradient(circle at 84% 16%, rgba(255, 211, 107, 0.22), transparent 24%),
        linear-gradient(145deg, #08070c 0%, #1a0815 44%, #270711 100%);
    }

    .message {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: clamp(18px, 5vw, 56px);
      text-align: center;
    }

    .message h1 {
      width: min(92vw, 980px);
      margin: 0;
      color: transparent;
      background: linear-gradient(92deg, #fff, #ffd7e7 35%, var(--gold) 64%, #fff);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 18px 24px rgba(255, 35, 79, 0.26));
      font-size: clamp(3rem, 11vw, 8rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 0.88;
      text-transform: lowercase;
      text-wrap: balance;
      opacity: calc(0.54 + var(--open, 0) * 0.46);
      transform: scale(calc(0.9 + var(--open, 0) * 0.1));
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .message h1 span {
      display: block;
    }

    .glow {
      position: absolute;
      inset: 18%;
      z-index: -1;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 79, 145, 0.52), transparent 68%);
      filter: blur(26px);
      opacity: calc(0.18 + var(--open, 0) * 0.48);
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 4;
      height: clamp(28px, 5vw, 48px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 34%),
        linear-gradient(90deg, #230914, #5f1029 18%, var(--pink) 50%, #5f1029 82%, #230914);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38);
    }

    .top-bar::after {
      position: absolute;
      inset: auto 0 -8px;
      height: 10px;
      content: "";
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.48) 0 2px, transparent 2px 15px);
      opacity: 0.55;
    }

    .flash {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 3;
      width: var(--s);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255, 79, 145, 0.56), transparent 70%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: flash 700ms ease-out forwards;
    }

    @keyframes flash {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (max-width: 560px) {
      .message h1 {
        width: min(90vw, 420px);
        font-size: clamp(2.8rem, 14vw, 3.8rem);
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Interactive string curtain revealing i love you sukriti">
    <section class="message" aria-live="polite">
      <div class="glow" aria-hidden="true"></div>
      <h1><span>i love</span><span>you</span><span>sukriti</span></h1>
    </section>
    <canvas id="curtain" aria-hidden="true"></canvas>
    <div class="top-bar" aria-hidden="true"></div>
  </main>

  <script>
    const scene = document.querySelector("#scene");
    const canvas = document.querySelector("#curtain");
    const ctx = canvas.getContext("2d");
    const strings = [];
    let width = 0;
    let height = 0;
    let dpr = 1;
    let openAmount = 0;
    let targetOpen = 0.08;
    let time = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStrings();
    }

    function createStrings() {
      strings.length = 0;
      const gap = clamp(width / 54, 8, 17);
      const count = Math.ceil(width / gap) + 8;
      const start = -gap * 4;

      for (let i = 0; i < count; i += 1) {
        strings.push({
          anchor: start + i * gap,
          offset: 0,
          velocity: 0,
          length: height * (0.82 + Math.random() * 0.24),
          phase: Math.random() * Math.PI * 2,
          bead: 0.1 + Math.random() * 0.84,
          hue: 330 + Math.random() * 34,
          thickness: 1.2 + Math.random() * 1.5
        });
      }
    }

    function pointerFromEvent(event) {
      return { x: event.clientX, y: event.clientY };
    }

    function bloom(x, y) {
      const flash = document.createElement("span");
      flash.className = "flash";
      flash.style.setProperty("--x", x + "px");
      flash.style.setProperty("--y", y + "px");
      flash.style.setProperty("--s", clamp(width * 0.32, 140, 320) + "px");
      scene.appendChild(flash);
      flash.addEventListener("animationend", () => flash.remove(), { once: true });
    }

    function disturb(x, y, force = 1) {
      const radius = clamp(width * 0.22, 96, 230);
      strings.forEach((string) => {
        const distance = x - (string.anchor + string.offset);
        const pull = Math.max(0, 1 - Math.abs(distance) / radius);
        if (!pull) return;

        const side = distance < 0 ? 1 : -1;
        const verticalBoost = 1 - clamp(y / height, 0, 0.86) * 0.42;
        string.velocity += side * pull * force * 15 * verticalBoost;
      });
    }

    function openCurtain(x, y) {
      targetOpen = 1;
      disturb(x, y, 1.9);
      bloom(x, y);
      window.clearTimeout(openCurtain.timer);
      openCurtain.timer = window.setTimeout(() => {
        targetOpen = 0.18;
      }, 3200);
    }

    function drawString(string, index) {
      const center = width / 2;
      const side = string.anchor < center ? -1 : 1;
      const distanceFromCenter = Math.abs(string.anchor - center) / center;
      const part = side * openAmount * (42 + 150 * (1 - distanceFromCenter));
      const wave = Math.sin(time * 0.025 + string.phase + index * 0.14) * (2 + openAmount * 7);
      const x = string.anchor + string.offset + part + wave;
      const bottom = string.length;
      const mid = bottom * 0.46;
      const cp1x = x + string.offset * 0.18 + wave * 1.8;
      const cp2x = x - string.offset * 0.1 - wave * 1.3;

      const gradient = ctx.createLinearGradient(x, 0, x, bottom);
      gradient.addColorStop(0, "rgba(255,255,255,0.92)");
      gradient.addColorStop(0.42, `hsla(${string.hue}, 92%, 82%, 0.78)`);
      gradient.addColorStop(1, "rgba(255,188,214,0.34)");

      ctx.beginPath();
      ctx.moveTo(string.anchor, 0);
      ctx.bezierCurveTo(cp1x, mid * 0.34, cp2x, mid, x, bottom);
      ctx.lineWidth = string.thickness;
      ctx.strokeStyle = gradient;
      ctx.shadowColor = `hsla(${string.hue}, 95%, 72%, 0.36)`;
      ctx.shadowBlur = 8;
      ctx.stroke();

      const beadY = bottom * string.bead;
      const beadX = x + Math.sin(time * 0.03 + string.phase) * 3;
      const beadSize = 3.5 + string.thickness * 1.6;

      ctx.beginPath();
      ctx.fillStyle = index % 5 === 0 ? "rgba(255,211,107,0.9)" : "rgba(255,255,255,0.82)";
      ctx.shadowBlur = 12;
      ctx.arc(beadX, beadY, beadSize, 0, Math.PI * 2);
      ctx.fill();
    }

    function render() {
      time += 1;
      openAmount += (targetOpen - openAmount) * 0.055;
      scene.style.setProperty("--open", openAmount.toFixed(3));

      ctx.clearRect(0, 0, width, height);
      ctx.globalCompositeOperation = "source-over";

      const veil = ctx.createLinearGradient(0, 0, 0, height);
      veil.addColorStop(0, "rgba(60, 8, 28, 0.74)");
      veil.addColorStop(0.46, `rgba(16, 7, 14, ${0.52 - openAmount * 0.32})`);
      veil.addColorStop(1, "rgba(8, 6, 10, 0.18)");
      ctx.fillStyle = veil;
      ctx.fillRect(0, 0, width, height);

      strings.forEach((string, index) => {
        const spring = -string.offset * 0.032;
        const damping = string.velocity * -0.06;
        string.velocity += spring + damping;
        string.offset += string.velocity;
        string.offset *= 0.993;
        drawString(string, index);
      });

      const shineX = width * (0.5 + Math.sin(time * 0.01) * 0.32);
      const shine = ctx.createLinearGradient(shineX - 120, 0, shineX + 120, 0);
      shine.addColorStop(0, "rgba(255,255,255,0)");
      shine.addColorStop(0.5, `rgba(255,255,255,${0.09 + openAmount * 0.12})`);
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.globalCompositeOperation = "screen";
      ctx.fillStyle = shine;
      ctx.fillRect(0, 0, width, height);

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);

    window.addEventListener("pointerdown", (event) => {
      const p = pointerFromEvent(event);
      openCurtain(p.x, p.y);
    });

    window.addEventListener("pointermove", (event) => {
      const p = pointerFromEvent(event);
      if (event.buttons || event.pointerType === "touch") {
        targetOpen = 0.92;
        disturb(p.x, p.y, 0.62);
      } else {
        targetOpen = p.y < height * 0.82 ? 0.18 : 0.08;
        disturb(p.x, p.y, 0.08);
      }
    }, { passive: true });

    window.addEventListener("pointerup", () => {
      targetOpen = 0.2;
    });

    window.addEventListener("pointercancel", () => {
      targetOpen = 0.12;
    });

    resize();
    render();

    window.setTimeout(() => {
      openCurtain(width / 2, height * 0.55);
    }, 550);
  </script>
</body>
</html>
