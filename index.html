<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i love you sukriti</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7fb;
      --rose: #ff4f8b;
      --coral: #ff8a66;
      --gold: #ffd16b;
      --mint: #8ff7d4;
      --night: #160b18;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      background: var(--night);
      color: var(--ink);
      touch-action: none;
    }

    body {
      min-height: 100svh;
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 100svh;
      isolation: isolate;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      background:
        radial-gradient(circle at 22% 16%, rgba(255, 143, 184, 0.4), transparent 28%),
        radial-gradient(circle at 82% 12%, rgba(143, 247, 212, 0.24), transparent 24%),
        radial-gradient(circle at 50% 92%, rgba(255, 209, 107, 0.26), transparent 34%),
        linear-gradient(140deg, #110816 0%, #31122c 44%, #35101c 100%);
    }

    .stage::before {
      position: absolute;
      inset: -20%;
      z-index: -2;
      content: "";
      background:
        conic-gradient(from 120deg at 50% 50%, rgba(255, 79, 139, 0.18), rgba(255, 209, 107, 0.1), rgba(143, 247, 212, 0.13), rgba(255, 79, 139, 0.18));
      filter: blur(18px);
      animation: slow-spin 28s linear infinite;
    }

    .stage::after {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 46%, black, transparent 72%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .message {
      position: relative;
      display: grid;
      width: min(100%, 920px);
      min-height: min(72svh, 680px);
      align-content: center;
      justify-items: center;
      gap: clamp(22px, 4vw, 36px);
      text-align: center;
      transform-style: preserve-3d;
    }

    .halo {
      position: absolute;
      width: min(74vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.18) 0 7%, transparent 8%),
        radial-gradient(circle, rgba(255, 79, 139, 0.34), transparent 64%);
      filter: blur(1px);
      opacity: 0.72;
      transform: translate3d(calc(var(--tilt-x, 0px) * -0.55), calc(var(--tilt-y, 0px) * -0.55), -80px);
      animation: breathe 4.8s ease-in-out infinite;
    }

    h1 {
      position: relative;
      max-width: 11ch;
      margin: 0;
      font-size: clamp(4rem, 16vw, 10.5rem);
      font-weight: 900;
      line-height: 0.84;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.5),
        0 14px 28px rgba(54, 4, 28, 0.56),
        0 0 42px rgba(255, 89, 145, 0.42);
      transform: translate3d(var(--tilt-x, 0px), var(--tilt-y, 0px), 42px) rotateX(calc(var(--ry, 0deg) * -1)) rotateY(var(--rx, 0deg));
      transition: transform 240ms ease;
    }

    h1 span {
      display: inline-block;
      background: linear-gradient(95deg, var(--ink), #ffd6e5 36%, var(--gold) 70%, #ffffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: shimmer 5.8s ease-in-out infinite;
    }

    .heart-button {
      position: relative;
      display: grid;
      width: clamp(82px, 18vw, 116px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 28%, rgba(255,255,255,0.9), transparent 13%),
        linear-gradient(145deg, #ff77a7, #ff3f76 52%, #ff8a66);
      box-shadow:
        0 24px 52px rgba(138, 13, 62, 0.5),
        inset 0 -10px 18px rgba(130, 0, 48, 0.24),
        inset 0 7px 16px rgba(255, 255, 255, 0.24);
      color: white;
      cursor: pointer;
      place-items: center;
      transform: translate3d(calc(var(--tilt-x, 0px) * 0.4), calc(var(--tilt-y, 0px) * 0.4), 60px);
      transition: transform 180ms ease, filter 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .heart-button:active {
      filter: saturate(1.25);
      transform: translate3d(calc(var(--tilt-x, 0px) * 0.4), calc(var(--tilt-y, 0px) * 0.4), 60px) scale(0.92);
    }

    .heart-button::before,
    .heart-button::after {
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(255, 214, 229, 0.45);
      border-radius: inherit;
      content: "";
      animation: ring 2.2s ease-out infinite;
    }

    .heart-button::after {
      animation-delay: 1.1s;
    }

    .heart-icon {
      width: 48%;
      aspect-ratio: 1;
      background: currentColor;
      clip-path: path("M24 42 C8 30 0 21 0 11 C0 4 5 0 11 0 C17 0 21 5 24 9 C27 5 31 0 37 0 C43 0 48 4 48 11 C48 21 40 30 24 42 Z");
      filter: drop-shadow(0 5px 7px rgba(116, 0, 39, 0.34));
    }

    .orbit {
      position: absolute;
      width: min(78vw, 600px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      transform: rotateX(68deg) rotateZ(0deg);
      animation: orbit 13s linear infinite;
    }

    .orbit i {
      position: absolute;
      width: 14px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 24px var(--mint);
    }

    .orbit i:nth-child(1) { top: -7px; left: 50%; }
    .orbit i:nth-child(2) { right: 8%; bottom: 18%; background: var(--gold); box-shadow: 0 0 24px var(--gold); }
    .orbit i:nth-child(3) { left: 10%; bottom: 22%; background: var(--rose); box-shadow: 0 0 24px var(--rose); }

    .pop {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 4;
      width: var(--s);
      height: var(--s);
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(45deg);
      background: hsl(var(--h), 93%, 68%);
      animation: fly 1.35s ease-out forwards;
      box-shadow: 0 0 18px hsla(var(--h), 93%, 68%, 0.7);
    }

    .pop::before,
    .pop::after {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
      content: "";
    }

    .pop::before { left: -50%; }
    .pop::after { top: -50%; }

    @keyframes slow-spin {
      to { transform: rotate(1turn); }
    }

    @keyframes breathe {
      50% { transform: translate3d(calc(var(--tilt-x, 0px) * -0.55), calc(var(--tilt-y, 0px) * -0.55), -80px) scale(1.08); }
    }

    @keyframes shimmer {
      50% { filter: brightness(1.18) saturate(1.16); }
    }

    @keyframes ring {
      to {
        opacity: 0;
        transform: scale(1.58);
      }
    }

    @keyframes orbit {
      to { transform: rotateX(68deg) rotateZ(360deg); }
    }

    @keyframes fly {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(45deg) scale(0.35);
      }
      16% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(45deg) scale(1.35);
      }
    }

    @media (max-width: 560px) {
      .message {
        min-height: 76svh;
      }

      h1 {
        max-width: 8ch;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="i love you sukriti">
    <canvas id="sparkles"></canvas>
    <section class="message">
      <div class="orbit" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="halo" aria-hidden="true"></div>
      <h1><span>i love you sukriti</span></h1>
      <button class="heart-button" id="heartButton" type="button" aria-label="Send love">
        <span class="heart-icon" aria-hidden="true"></span>
      </button>
    </section>
  </main>

  <script>
    const stage = document.querySelector("#stage");
    const button = document.querySelector("#heartButton");
    const canvas = document.querySelector("#sparkles");
    const ctx = canvas.getContext("2d");
    const particles = [];
    let width = 0;
    let height = 0;
    let lastTrail = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function setTilt(x, y) {
      const nx = (x / width - 0.5) * 2;
      const ny = (y / height - 0.5) * 2;
      stage.style.setProperty("--tilt-x", (nx * 18).toFixed(2) + "px");
      stage.style.setProperty("--tilt-y", (ny * 14).toFixed(2) + "px");
      stage.style.setProperty("--rx", (nx * 8).toFixed(2) + "deg");
      stage.style.setProperty("--ry", (ny * 6).toFixed(2) + "deg");
    }

    function addParticle(x, y, options = {}) {
      particles.push({
        x,
        y,
        vx: (Math.random() - 0.5) * (options.force || 7),
        vy: (Math.random() - 0.75) * (options.force || 7),
        life: 1,
        decay: 0.011 + Math.random() * 0.018,
        size: options.size || (2 + Math.random() * 5),
        hue: options.hue || (332 + Math.random() * 44)
      });
    }

    function burst(x, y, count = 28) {
      for (let i = 0; i < count; i += 1) {
        addParticle(x, y, { force: 10, size: 2 + Math.random() * 6 });
      }

      for (let i = 0; i < 12; i += 1) {
        const heart = document.createElement("span");
        heart.className = "pop";
        heart.style.setProperty("--x", x + "px");
        heart.style.setProperty("--y", y + "px");
        heart.style.setProperty("--s", 10 + Math.random() * 16 + "px");
        heart.style.setProperty("--h", 338 + Math.random() * 36);
        heart.style.setProperty("--dx", (Math.random() - 0.5) * 260 + "px");
        heart.style.setProperty("--dy", -80 - Math.random() * 190 + "px");
        stage.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.045;
        p.vx *= 0.99;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 95%, 70%, ${p.life})`;
        ctx.shadowColor = `hsla(${p.hue}, 95%, 70%, ${p.life})`;
        ctx.shadowBlur = 14;
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    function pointerPosition(event) {
      const point = event.touches ? event.touches[0] : event;
      return { x: point.clientX, y: point.clientY };
    }

    function touchLove(event) {
      const { x, y } = pointerPosition(event);
      setTilt(x, y);
      const now = performance.now();
      if (now - lastTrail > 35) {
        lastTrail = now;
        for (let i = 0; i < 4; i += 1) addParticle(x, y, { force: 5, size: 2 + Math.random() * 4 });
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", touchLove, { passive: true });
    window.addEventListener("pointerdown", (event) => {
      const { x, y } = pointerPosition(event);
      setTilt(x, y);
      burst(x, y, 34);
    });
    button.addEventListener("click", (event) => {
      const rect = button.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 48);
      event.stopPropagation();
    });

    resize();
    animate();
    burst(width / 2, height / 2, 54);
  </script>
</body>
</html>
