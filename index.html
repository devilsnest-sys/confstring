<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i love you sukriti</title>
  <style>
    :root {
      color-scheme: dark;
      --open: 0;
      --ink: #fff6fb;
      --pink: #ff4a93;
      --gold: #ffd166;
      --cyan: #7de7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07060a;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      touch-action: none;
      user-select: none;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 46%, rgba(255, 74, 147, 0.34), transparent 23%),
        radial-gradient(circle at 22% 15%, rgba(125, 231, 255, 0.2), transparent 25%),
        radial-gradient(circle at 80% 17%, rgba(255, 209, 102, 0.18), transparent 24%),
        linear-gradient(155deg, #06050a 0%, #1a0715 44%, #270611 100%);
    }

    .scene::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      content: "";
      background:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 74%);
      opacity: 0.8;
    }

    .back-message {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 46px);
      text-align: center;
      opacity: calc(0.3 + var(--open) * 0.7);
      transform: scale(calc(0.92 + var(--open) * 0.08));
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .back-message h1 {
      width: min(92vw, 950px);
      margin: 0;
      color: transparent;
      background: linear-gradient(95deg, #ffffff, #ffc5de 36%, var(--gold) 68%, #ffffff);
      background-clip: text;
      -webkit-background-clip: text;
      filter:
        drop-shadow(0 16px 22px rgba(255, 55, 116, 0.25))
        drop-shadow(0 0 32px rgba(255, 74, 147, 0.22));
      font-size: clamp(3rem, 11vw, 8.7rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 0.9;
      text-transform: lowercase;
    }

    .back-message span {
      display: block;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .rail {
      position: absolute;
      inset: 0 0 auto;
      z-index: 4;
      height: clamp(32px, 6vw, 58px);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.24), transparent 38%),
        linear-gradient(90deg, #160711, #5c0d2b 20%, #ff4a93 50%, #5c0d2b 80%, #160711);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.46);
    }

    .rail::after {
      position: absolute;
      inset: auto 0 -12px;
      height: 12px;
      content: "";
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 2px, transparent 2px 16px);
      opacity: 0.58;
    }

    .tap-glow {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 3;
      width: clamp(150px, 36vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,0.82), rgba(255,74,147,0.38), transparent 70%);
      transform: translate(-50%, -50%) scale(0.22);
      animation: tap 760ms ease-out forwards;
    }

    @keyframes tap {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @media (max-width: 560px) {
      .back-message h1 {
        width: min(88vw, 360px);
        font-size: clamp(2.6rem, 13.2vw, 3.7rem);
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Fluid text-string curtain revealing i love you sukriti">
    <section class="back-message" aria-live="polite">
      <h1><span>i love</span><span>you</span><span>sukriti</span></h1>
    </section>
    <canvas id="curtain" aria-hidden="true"></canvas>
    <div class="rail" aria-hidden="true"></div>
  </main>

  <script>
    const phrase = "i love you sukriti";
    const repeatedPhrase = `${phrase}   ${phrase}   `;
    const scene = document.querySelector("#scene");
    const canvas = document.querySelector("#curtain");
    const ctx = canvas.getContext("2d");
    const strands = [];
    const pointer = { x: 0, y: 0, down: false, lastX: 0, lastY: 0 };
    let width = 0;
    let height = 0;
    let dpr = 1;
    let time = 0;
    let open = 0.2;
    let targetOpen = 0.18;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildCurtain();
    }

    function buildCurtain() {
      strands.length = 0;
      const spacing = clamp(width / 34, 13, 28);
      const count = Math.ceil(width / spacing) + 8;
      const start = -spacing * 4;

      for (let i = 0; i < count; i += 1) {
        const anchor = start + i * spacing;
        const depth = i / Math.max(1, count - 1);
        strands.push({
          anchor,
          phase: Math.random() * Math.PI * 2,
          offset: 0,
          velocity: 0,
          length: height * (0.88 + Math.random() * 0.18),
          charShift: Math.floor(Math.random() * repeatedPhrase.length),
          size: clamp(width / 54, 12, 20),
          colorA: `hsla(${326 + Math.random() * 34}, 96%, 76%, 0.96)`,
          colorB: depth % 0.19 < 0.095 ? "rgba(255, 209, 102, 0.92)" : "rgba(255, 246, 251, 0.92)"
        });
      }
    }

    function pointerPoint(event) {
      return { x: event.clientX, y: event.clientY };
    }

    function flash(x, y) {
      const dot = document.createElement("span");
      dot.className = "tap-glow";
      dot.style.setProperty("--x", x + "px");
      dot.style.setProperty("--y", y + "px");
      scene.appendChild(dot);
      dot.addEventListener("animationend", () => dot.remove(), { once: true });
    }

    function tugCurtain(x, y, strength) {
      const radius = clamp(width * 0.28, 120, 310);
      strands.forEach((strand) => {
        const currentX = strand.anchor + strand.offset;
        const distance = x - currentX;
        const pull = Math.max(0, 1 - Math.abs(distance) / radius);
        if (!pull) return;

        const direction = distance < 0 ? 1 : -1;
        const heightFactor = 1 - clamp(y / height, 0, 0.9) * 0.36;
        strand.velocity += direction * pull * strength * 18 * heightFactor;
      });
    }

    function revealAt(x, y) {
      targetOpen = 1;
      tugCurtain(x, y, 2.2);
      flash(x, y);
      window.clearTimeout(revealAt.timer);
      revealAt.timer = window.setTimeout(() => {
        targetOpen = 0.28;
      }, 3600);
    }

    function strandX(strand, y, index) {
      const center = width / 2;
      const side = strand.anchor < center ? -1 : 1;
      const centerDistance = Math.abs(strand.anchor - center) / Math.max(1, center);
      const arch = side * open * (54 + 180 * (1 - centerDistance));
      const flowA = Math.sin(time * 0.022 + strand.phase + y * 0.012) * (8 + open * 18);
      const flowB = Math.sin(time * 0.014 + index * 0.41 + y * 0.006) * (4 + open * 9);
      const drag = strand.offset * (0.16 + y / Math.max(1, strand.length) * 0.82);
      const breathing = Math.sin(time * 0.01 + index * 0.33) * (2.8 + open * 5.4);
      return strand.anchor + arch + flowA + flowB + drag + breathing;
    }

    function drawVeil() {
      const shade = ctx.createLinearGradient(0, 0, 0, height);
      shade.addColorStop(0, "rgba(46, 7, 26, 0.68)");
      shade.addColorStop(0.5, `rgba(13, 6, 13, ${0.58 - open * 0.36})`);
      shade.addColorStop(1, "rgba(7, 5, 9, 0.24)");
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, width, height);

      const shineX = width * (0.5 + Math.sin(time * 0.008) * 0.36);
      const shine = ctx.createLinearGradient(shineX - 150, 0, shineX + 150, 0);
      shine.addColorStop(0, "rgba(255,255,255,0)");
      shine.addColorStop(0.5, `rgba(255,255,255,${0.06 + open * 0.16})`);
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shine;
      ctx.fillRect(0, 0, width, height);
    }

    function drawStrand(strand, index) {
      const step = strand.size * 1.08;
      const top = clamp(height * 0.045, 34, 62);
      const maxY = strand.length;
      let previousX = strandX(strand, top, index);
      let previousY = top;

      ctx.beginPath();
      ctx.moveTo(strand.anchor, 0);
      for (let y = top; y <= maxY; y += step * 0.9) {
        const x = strandX(strand, y, index);
        ctx.lineTo(x, y);
        previousX = x;
        previousY = y;
      }

      const thread = ctx.createLinearGradient(strand.anchor, 0, previousX, previousY);
      thread.addColorStop(0, "rgba(255,255,255,0.46)");
      thread.addColorStop(1, "rgba(255,125,175,0.2)");
      ctx.lineWidth = 1;
      ctx.strokeStyle = thread;
      ctx.shadowColor = "rgba(255,74,147,0.36)";
      ctx.shadowBlur = 10;
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `800 ${strand.size}px "Segoe UI", system-ui, sans-serif`;

      for (let y = top + strand.size; y < maxY; y += step) {
        const charIndex = Math.floor((y - top) / step + strand.charShift + time * 0.018) % repeatedPhrase.length;
        const char = repeatedPhrase[charIndex];
        if (char === " ") continue;

        const x = strandX(strand, y, index);
        const xAhead = strandX(strand, y + 10, index);
        const angle = Math.atan2(10, xAhead - x) - Math.PI / 2;
        const pulse = 0.76 + Math.sin(time * 0.04 + y * 0.06 + strand.phase) * 0.2;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = charIndex % 7 === 0 ? strand.colorB : strand.colorA;
        ctx.globalAlpha = clamp(pulse + open * 0.2, 0.5, 1);
        ctx.shadowColor = charIndex % 7 === 0 ? "rgba(255,209,102,0.8)" : "rgba(255,74,147,0.72)";
        ctx.shadowBlur = 9 + open * 9;
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
    }

    function stepPhysics() {
      strands.forEach((strand) => {
        const spring = -strand.offset * 0.021;
        const damping = -strand.velocity * 0.043;
        strand.velocity += spring + damping;
        strand.offset += strand.velocity;
        strand.offset *= 0.994;
      });
    }

    function render() {
      time += 1;
      open += (targetOpen - open) * 0.05;
      scene.style.setProperty("--open", open.toFixed(3));
      stepPhysics();

      ctx.clearRect(0, 0, width, height);
      ctx.globalCompositeOperation = "source-over";
      drawVeil();
      strands.forEach(drawStrand);

      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);

    window.addEventListener("pointerdown", (event) => {
      pointer.down = true;
      const p = pointerPoint(event);
      pointer.x = pointer.lastX = p.x;
      pointer.y = pointer.lastY = p.y;
      revealAt(p.x, p.y);
    });

    window.addEventListener("pointermove", (event) => {
      const p = pointerPoint(event);
      const speed = Math.hypot(p.x - pointer.lastX, p.y - pointer.lastY);
      pointer.lastX = p.x;
      pointer.lastY = p.y;

      if (pointer.down || event.pointerType === "touch") {
        targetOpen = 0.96;
        tugCurtain(p.x, p.y, clamp(0.45 + speed / 32, 0.45, 1.6));
      } else {
        targetOpen = 0.24;
        tugCurtain(p.x, p.y, 0.12);
      }
    }, { passive: true });

    window.addEventListener("pointerup", () => {
      pointer.down = false;
      targetOpen = 0.34;
    });

    window.addEventListener("pointercancel", () => {
      pointer.down = false;
      targetOpen = 0.22;
    });

    resize();
    render();

    window.setTimeout(() => {
      revealAt(width / 2, height * 0.56);
    }, 420);
  </script>
</body>
</html>
